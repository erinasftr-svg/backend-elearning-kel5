<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Portal - Kelompok 5</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #f4f4f9;}
        .login-box { background: white; border: 1px solid #ccc; padding: 40px; display: inline-block; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { margin: 10px 0; padding: 12px; width: 85%; border: 1px solid #ccc; border-radius: 5px;}
        button { margin-top: 15px; padding: 12px 25px; background-color: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;}
        button:hover { background-color: #004494; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Portal E-Learning</h2>
        <form action="/login" method="POST">
            <input type="type" name="email" placeholder="Email Akun AWS Cognito" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Masuk ke Sistem</button>
        </form>
    </div>
</body>
</html>
